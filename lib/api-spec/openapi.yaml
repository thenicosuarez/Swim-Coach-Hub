openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Swim Coach API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bookings
    description: Booking operations
  - name: contact
    description: Contact operations
  - name: coach
    description: Coach dashboard operations (password-protected)
  - name: plans
    description: Public plan sharing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /bookings:
    get:
      operationId: getBookings
      tags: [bookings]
      summary: Get all bookings (coach-protected)
      parameters:
        - in: header
          name: x-coach-password
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          description: Unauthorized
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Create a new booking request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBookingRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
  /contact:
    post:
      operationId: submitContact
      tags: [contact]
      summary: Submit a contact/inquiry form
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactRequest"
      responses:
        "200":
          description: Contact submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactResponse"
  /coach/bookings:
    get:
      operationId: getCoachBookings
      tags: [coach]
      summary: Get all bookings for coach review
      parameters:
        - in: header
          name: x-coach-password
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of bookings sorted newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
        "401":
          description: Unauthorized
  /coach/bookings/{id}/approve:
    patch:
      operationId: approveBooking
      tags: [coach]
      summary: Approve a booking and auto-create client
      parameters:
        - in: header
          name: x-coach-password
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found
  /coach/bookings/{id}/reject:
    patch:
      operationId: rejectBooking
      tags: [coach]
      summary: Reject a booking with optional note
      parameters:
        - in: header
          name: x-coach-password
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note:
                  type: string
      responses:
        "200":
          description: Booking rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "404":
          description: Booking not found
  /coach/clients:
    get:
      operationId: getCoachClients
      tags: [coach]
      summary: List all clients
      parameters:
        - in: header
          name: x-coach-password
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of clients
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"
  /coach/clients/{id}:
    patch:
      operationId: updateCoachClient
      tags: [coach]
      summary: Update client notes or status
      parameters:
        - in: header
          name: x-coach-password
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes:
                  type: string
                status:
                  type: string
      responses:
        "200":
          description: Client updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
  /coach/plans:
    get:
      operationId: getCoachPlans
      tags: [coach]
      summary: List all coaching plans
      parameters:
        - in: header
          name: x-coach-password
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoachingPlan"
    post:
      operationId: createCoachPlan
      tags: [coach]
      summary: Create a new coaching plan
      parameters:
        - in: header
          name: x-coach-password
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlanRequest"
      responses:
        "201":
          description: Plan created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingPlan"
  /coach/plans/{id}:
    patch:
      operationId: updateCoachPlan
      tags: [coach]
      summary: Update a coaching plan
      parameters:
        - in: header
          name: x-coach-password
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlanRequest"
      responses:
        "200":
          description: Plan updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoachingPlan"
  /plans/share/{token}:
    get:
      operationId: getSharedPlan
      tags: [plans]
      summary: Get a public coaching plan by share token
      parameters:
        - in: path
          name: token
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Public plan data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharedPlan"
        "404":
          description: Plan not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Booking:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        service:
          type: string
          enum: [private_lesson, group_session, stroke_clinic, video_analysis, package_5, package_10]
        preferredDate:
          type: string
        preferredTime:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [pending, confirmed, cancelled, approved, rejected]
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - service
        - status
        - createdAt
    CreateBookingRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        service:
          type: string
          enum: [private_lesson, group_session, stroke_clinic, video_analysis, package_5, package_10]
        preferredDate:
          type: string
        preferredTime:
          type: string
        notes:
          type: string
      required:
        - name
        - email
        - service
    ContactRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        message:
          type: string
      required:
        - name
        - email
        - message
    ContactResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success
        - message
    Client:
      type: object
      properties:
        id:
          type: integer
        bookingId:
          type: integer
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        neighborhood:
          type: string
        service:
          type: string
        notes:
          type: string
        status:
          type: string
          enum: [active, inactive]
        createdAt:
          type: string
      required:
        - id
        - name
        - email
        - status
        - createdAt
    CoachingPlan:
      type: object
      properties:
        id:
          type: integer
        clientId:
          type: integer
        title:
          type: string
        goal:
          type: string
        drills:
          type: string
        notes:
          type: string
        shareToken:
          type: string
        isPublic:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - id
        - title
        - shareToken
        - isPublic
        - createdAt
        - updatedAt
    CreatePlanRequest:
      type: object
      properties:
        title:
          type: string
        goal:
          type: string
        drills:
          type: string
        notes:
          type: string
        clientId:
          type: integer
        isPublic:
          type: boolean
      required:
        - title
    UpdatePlanRequest:
      type: object
      properties:
        title:
          type: string
        goal:
          type: string
        drills:
          type: string
        notes:
          type: string
        clientId:
          type: integer
        isPublic:
          type: boolean
    SharedPlan:
      type: object
      properties:
        title:
          type: string
        goal:
          type: string
        drills:
          type: string
        notes:
          type: string
        clientName:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string
      required:
        - title
        - createdAt
        - updatedAt
