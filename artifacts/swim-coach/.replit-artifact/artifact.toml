kind = "web"
previewPath = "/"
title = "Swim Coach"
version = "1.0.0"
id = "artifacts/swim-coach"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 18674
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/swim-coach run dev"

[services.env]
PORT = "18674"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/swim-coach", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/swim-coach", "run", "start"]

[services.production.run.env]
PORT = "18674"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/health"
