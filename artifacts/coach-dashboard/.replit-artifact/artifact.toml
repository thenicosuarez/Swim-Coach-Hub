kind = "web"
previewPath = "/coach/"
title = "Coach Dashboard"
version = "1.0.0"
id = "artifacts/coach-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23134
name = "web"
paths = ["/coach/"]

[services.development]
run = "pnpm --filter @workspace/coach-dashboard run dev"

[services.env]
PORT = "23134"
BASE_PATH = "/coach/"

[services.production]
build = ["pnpm", "--filter", "@workspace/coach-dashboard", "run", "build"]
publicDir = "artifacts/coach-dashboard/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
