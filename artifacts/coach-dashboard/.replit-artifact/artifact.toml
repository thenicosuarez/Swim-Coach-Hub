kind = "web"
previewPath = "/coach/"
title = "Coach Dashboard"
version = "1.0.0"
id = "artifacts/coach-dashboard"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 23134
name = "web"
paths = ["/coach/"]

[services.development]
run = "pnpm --filter @workspace/coach-dashboard run dev"

[services.env]
PORT = "23134"
BASE_PATH = "/coach"
NEXT_PUBLIC_BASE_PATH = "/coach"

[services.production]
build = ["pnpm", "--filter", "@workspace/coach-dashboard", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/coach-dashboard", "run", "start"]

[services.production.run.env]
PORT = "23134"
NODE_ENV = "production"
BASE_PATH = "/coach"
NEXT_PUBLIC_BASE_PATH = "/coach"
